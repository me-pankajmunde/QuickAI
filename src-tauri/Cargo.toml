[package]
name = "quickai"
version = "0.1.0"
description = "QuickAI Coding Agent Desktop Application"
authors = ["QuickAI"]
license = "MIT"
repository = ""
default-run = "quickai"
edition = "2021"
rust-version = "1.70"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.8", features = [
  "clipboard-all",
  "dialog-all",
  "fs-all",
  "global-shortcut-all",
  "notification-all",
  "os-all",
  "path-all",
  "shell-open",
  "system-tray",
  "window-all",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.11"

[features]
custom-protocol = ["tauri/custom-protocol"]
